[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim-plugin-openfoam"
version = "0.1.0"
description = "OpenFOAM driver for sim."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Weiqi Ji", email = "jiweiqi10@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "httpx>=0.27",
    "sim-cli-core>=0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "build>=1.0",
]

[project.entry-points."sim.drivers"]
openfoam = "sim_plugin_openfoam:OpenFOAMDriver"

[project.entry-points."sim.skills"]
openfoam = "sim_plugin_openfoam:skills_dir"

[project.entry-points."sim.plugins"]
openfoam = "sim_plugin_openfoam:plugin_info"

[project.urls]
Homepage = "https://github.com/svd-ai-lab/sim-plugin-openfoam"
Repository = "https://github.com/svd-ai-lab/sim-plugin-openfoam"
Issues = "https://github.com/svd-ai-lab/sim-plugin-openfoam/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/sim_plugin_openfoam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that build wheels or require a remote OpenFOAM sim-server",
]
